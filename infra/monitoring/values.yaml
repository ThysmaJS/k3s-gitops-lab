grafana:
  adminPassword: "ChangeMe123!"

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - grafana.thysmadev.fr

  persistence:
    enabled: true
    size: 2Gi

kubelet:
  serviceMonitor:
    https: true
    insecureSkipVerify: true
    cAdvisorRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path

prometheus:
  # NodePort so satellite clusters (e.g. HP_laptop_cluster) can remote_write
  # metrics over the LAN without going through the public Cloudflare tunnel.
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retention: 7d
    # Accepts remote_write pushes from satellite clusters' Prometheus agents.
    enableRemoteWriteReceiver: true
    # Labels this cluster's own metrics so they're distinguishable from
    # satellites in multi-cluster dashboards (hp-laptop-cluster sets its own
    # via hp-laptop-cluster/monitoring-agent.yaml).
    externalLabels:
      cluster: in-cluster
    resources:
      requests:
        memory: "400Mi"
        cpu: "100m"
      limits:
        memory: "1500Mi"
        cpu: "500m"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# k3s embeds ces composants dans un seul binaire — leurs endpoints ne sont pas exposés
# de la même façon que dans un cluster kubeadm standard
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

alertmanager:
  enabled: true
