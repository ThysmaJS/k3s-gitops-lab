# Registre d'images léger (~50Mi RAM) — remplace Harbor (démonté) pour les
# quelques apps custom du homelab. Pas d'auth : accessible seulement en LAN
# via le NodePort, jamais exposé sur le tunnel Cloudflare.
#
# IMPORTANT — à faire une seule fois sur CHAQUE node (containerd pull les
# images depuis le node lui-même, pas depuis l'intérieur d'un pod : la DNS
# interne du cluster ne s'applique pas, et le registre est en HTTP simple) :
#
#   sudo tee /etc/rancher/k3s/registries.yaml <<'EOF'
#   mirrors:
#     "192.168.0.201:30500":
#       endpoint: ["http://192.168.0.201:30500"]
#     "192.168.0.202:30500":
#       endpoint: ["http://192.168.0.202:30500"]
#   EOF
#   sudo systemctl restart k3s
#
# Les manifests d'apps référencent l'image par IP:port de node
# (ex. 192.168.0.202:30500/onward:v1), jamais par le nom de service
# interne registry.registry.svc.cluster.local.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
      protocol: TCP
