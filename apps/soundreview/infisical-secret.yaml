# Seules les valeurs réellement sensibles passent par Infisical. L'URL Supabase,
# la clé publiable, la clé VAPID publique et l'adresse d'expédition sont
# publiques par nature — elles sont écrites en clair dans deployment.yaml et
# cronjobs.yaml plutôt que de gonfler le coffre sans rien protéger.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: ghcr-pull-secret
  namespace: soundreview
spec:
  infisicalAuthRef:
    name: machine-identity
    namespace: infisical
  sources:
    - projectSlug: k3s-gitops-lab
      environmentSlug: prod
      secretPath: /soundreview/ghcr-pull-secret
  syncOptions:
    refreshInterval: 5m
  targets:
    - kind: Secret
      name: ghcr-pull-secret
      namespace: soundreview
      creationPolicy: Owner
      secretType: kubernetes.io/dockerconfigjson
      template:
        engineVersion: v1
        data:
          .dockerconfigjson: "{{ .dockerconfigjson.Value }}"
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: soundreview-secrets
  namespace: soundreview
spec:
  infisicalAuthRef:
    name: machine-identity
    namespace: infisical
  sources:
    - projectSlug: k3s-gitops-lab
      environmentSlug: prod
      secretPath: /soundreview/soundreview-secrets
  syncOptions:
    refreshInterval: 5m
  targets:
    - kind: Secret
      name: soundreview-secrets
      namespace: soundreview
      creationPolicy: Owner
      secretType: Opaque
