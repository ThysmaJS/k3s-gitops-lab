apiVersion: apps/v1
kind: Deployment
metadata:
  name: onward
  namespace: onward
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: onward
  template:
    metadata:
      labels:
        app: onward
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: migrate
          # Tag mis à jour automatiquement par la CI (.github/workflows/deploy.yml
          # du repo onward) à chaque push sur main — un commit SHA immuable,
          # jamais réécrit sur le même tag.
          image: ghcr.io/thysmajs/onward:1e54200c9ab9a8eb25709f23a514a1ebb11b7cf8
          imagePullPolicy: Always
          command: ["node", "scripts/migrate.mjs"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: onward-secrets
                  key: database-url
      containers:
        - name: onward
          image: ghcr.io/thysmajs/onward:1e54200c9ab9a8eb25709f23a514a1ebb11b7cf8
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: onward-secrets
                  key: database-url
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: onward-secrets
                  key: auth-secret
            - name: MODERATOR_EMAILS
              valueFrom:
                secretKeyRef:
                  name: onward-secrets
                  key: moderator-emails
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onward-secrets
                  key: resend-api-key
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "300m"
