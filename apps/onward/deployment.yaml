apiVersion: apps/v1
kind: Deployment
metadata:
  name: onward
  namespace: onward
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: onward
  template:
    metadata:
      labels:
        app: onward
    spec:
      # Registre interne, sans auth (voir infra/registry) — pas
      # d'imagePullSecrets nécessaire.
      initContainers:
        - name: migrate
          image: registry.registry.svc.cluster.local:5000/onward:v1
          # Pas de CI ici : le tag peut être republié sur le même nom
          # pendant l'itération manuelle — éviter un pull périmé.
          imagePullPolicy: Always
          command: ["node", "scripts/migrate.mjs"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: onward-secrets
                  key: database-url
      containers:
        - name: onward
          image: registry.registry.svc.cluster.local:5000/onward:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: onward-secrets
                  key: database-url
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: onward-secrets
                  key: auth-secret
            - name: MODERATOR_EMAILS
              valueFrom:
                secretKeyRef:
                  name: onward-secrets
                  key: moderator-emails
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onward-secrets
                  key: resend-api-key
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "300m"
