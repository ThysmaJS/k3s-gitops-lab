apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onward-postgres-data
  namespace: onward
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: onward
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onward-postgres
  template:
    metadata:
      labels:
        app: onward-postgres
    spec:
      containers:
        - name: postgres
          # Mirror multi-arch (amd64 + arm64) — l'image officielle
          # postgis/postgis ne publie que amd64.
          image: imresamu/postgis:17-3.5
          env:
            - name: POSTGRES_DB
              value: onward
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: onward-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onward-secrets
                  key: postgres-password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "300m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: onward-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: onward
spec:
  selector:
    app: onward-postgres
  ports:
    - port: 5432
      targetPort: 5432
