# Nécessite le Prometheus Operator (déjà installé via infra/monitoring —
# kube-prometheus-stack, vu dans infra/monitoring/values.yaml).
#
# Prometheus n'écoute que les ServiceMonitor portant release: monitoring
# (vérifié : kubectl get prometheus -A -o jsonpath='{.items[0].spec.serviceMonitorSelector}'
# → {"matchLabels":{"release":"monitoring"}}) — d'où le label ci-dessous.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: freeroom
  namespace: freeroom
  labels:
    app: freeroom
    release: monitoring
spec:
  selector:
    matchLabels:
      app: freeroom
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
