apiVersion: apps/v1
kind: Deployment
metadata:
  name: freeroom
  namespace: freeroom
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: freeroom
  template:
    metadata:
      labels:
        app: freeroom
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # No initContainer needed here (contrairement à onward) : l'image
      # freeroom lance schéma + seed via son propre ENTRYPOINT
      # (docker/entrypoint.sh) avant `next start`, idempotent à chaque
      # démarrage du pod.
      containers:
        - name: freeroom
          # Tag à mettre à jour manuellement (ou via CI côté repo freeroom,
          # même patron que .github/workflows/deploy.yml d'onward) à chaque
          # nouvelle image poussée sur ghcr.io.
          image: ghcr.io/thysmajs/freeroom:d05f9f0e7fc65b72a7d14a445fcd77aa8977add6
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: freeroom-secrets
                  key: database-url
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: freeroom-secrets
                  key: session-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "300m"
