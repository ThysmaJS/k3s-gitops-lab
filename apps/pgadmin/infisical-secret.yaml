apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: pgadmin-secrets
  namespace: freeroom
spec:
  infisicalAuthRef:
    name: machine-identity
    namespace: infisical
  sources:
    - projectSlug: k3s-gitops-lab
      environmentSlug: prod
      secretPath: /freeroom/pgadmin-secrets
  syncOptions:
    refreshInterval: 5m
  targets:
    - kind: Secret
      name: pgadmin-secrets
      namespace: freeroom
      creationPolicy: Owner
      secretType: Opaque
