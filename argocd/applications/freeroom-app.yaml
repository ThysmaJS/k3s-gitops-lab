apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: freeroom
  namespace: argocd
  annotations:
    # Après wave 1 (infra/registry, infisical-config) : l'image doit être
    # disponible dans le registre et le secret Infisical prêt.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/ThysmaJS/k3s-gitops-lab.git
    targetRevision: HEAD
    path: apps/freeroom
  destination:
    server: https://kubernetes.default.svc
    namespace: freeroom
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
