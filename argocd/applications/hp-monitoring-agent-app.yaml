apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hp-monitoring-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ThysmaJS/k3s-gitops-lab.git
    targetRevision: HEAD
    path: hp-laptop-cluster
  destination:
    name: HP_laptop_cluster
    namespace: monitoring-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
