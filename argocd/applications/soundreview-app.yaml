apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: soundreview
  namespace: argocd
  annotations:
    # Wave 2, comme onward : l'image doit être dans GHCR et le secret Infisical
    # prêt avant que le Deployment ne démarre.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/ThysmaJS/k3s-gitops-lab.git
    targetRevision: HEAD
    path: apps/soundreview
  destination:
    server: https://kubernetes.default.svc
    namespace: soundreview
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
